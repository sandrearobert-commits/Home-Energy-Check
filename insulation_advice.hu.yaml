attic_advice:
  pass:
    headline: "✅ Megfelel (jó eséllyel pályázati követelmény alatt)"
    bullets:
      - "A becsült U-érték a határ alatt van."
      - "Tartsd meg a vastagságot folytonosan, ne maradjanak hézagok."
      - "Kémény körül tűztávolságot tarts be; nem éghető anyag előny."
  borderline:
    headline: "⚠️ Határeset (inkább növeld a vastagságot)"
    bullets:
      - "Papíron közel lehet a határhoz, de a kivitelezési veszteségek rontanak."
      - "Javaslat: válassz nagyobb vastagságot vagy jobb λ értékű anyagot."
  fail:
    headline: "❌ Nem felel meg (vékony/gyenge anyag)"
    bullets:
      - "Növeld a vastagságot (pl. 25–30 cm), vagy válts jobb hővezetésű anyagra."
      - "Figyelj a villanyvezetékekre, spotlámpákra és a szellőzésre."
